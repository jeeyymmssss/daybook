<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{
  --scene-a:#968878; --scene-b:#5E534A; --scene-c:#BFB2A3; --scene-d:#8A9486;
  --glass:rgba(255,255,255,.13); --glass-strong:rgba(255,255,255,.2); --glass-hover:rgba(255,255,255,.24);
  --edge:rgba(255,255,255,.32); --edge-soft:rgba(255,255,255,.14);
  --ink:#FFFFFF; --muted:rgba(255,255,255,.72); --faint:rgba(255,255,255,.38); --line:rgba(255,255,255,.18);
  --sun:#F6C75A; --sun-ink:#3B2C06; --sun-text:#FFD980; --danger:#FFB4A8;
  --blur:blur(28px) saturate(150%);
  --lift:0 24px 60px rgba(30,22,15,.28), inset 0 1px 0 rgba(255,255,255,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --scene-a:#3A342F; --scene-b:#15130F; --scene-c:#5C5046; --scene-d:#2E3A33;
    --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12); --glass-hover:rgba(255,255,255,.16);
    --edge:rgba(255,255,255,.18); --edge-soft:rgba(255,255,255,.08);
    --lift:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  }
}
:root[data-theme="dark"]{
  --scene-a:#3A342F; --scene-b:#15130F; --scene-c:#5C5046; --scene-d:#2E3A33;
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12); --glass-hover:rgba(255,255,255,.16);
  --edge:rgba(255,255,255,.18); --edge-soft:rgba(255,255,255,.08);
  --lift:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html{background:var(--scene-b)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Lexend,"Segoe UI",system-ui,sans-serif;font-weight:400;position:relative;overflow-x:hidden}
/* the soft "room" behind the glass */
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(60% 50% at 18% 20%, var(--scene-c) 0%, transparent 70%),
    radial-gradient(45% 45% at 85% 85%, var(--scene-d) 0%, transparent 70%),
    linear-gradient(160deg,var(--scene-a) 0%,var(--scene-b) 100%);}
.scene i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.scene i:nth-child(1){width:42vw;height:42vw;left:-8vw;bottom:-14vw;background:#D9CAB6}
.scene i:nth-child(2){width:30vw;height:30vw;right:6vw;top:-8vw;background:#C7B39E}
.scene i:nth-child(3){width:22vw;height:22vw;left:44vw;top:40vh;background:#F6C75A;opacity:.18}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.18));}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.pane{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge-soft);border-top-color:var(--edge);box-shadow:var(--lift)}
body{display:grid;place-items:center;padding:24px}
.card{width:min(900px,100%);border-radius:36px;display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden;padding:10px;gap:10px}
.intro{border-radius:28px;padding:34px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,.04));border:1px solid var(--edge-soft);position:relative;overflow:hidden}
.intro::after{content:"";position:absolute;right:-90px;bottom:-110px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(246,199,90,.4),rgba(246,199,90,0) 70%);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px}
.mark{width:28px;height:28px;border-radius:50% 50% 50% 12px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-size:14px}
.intro h1{font-weight:600;font-size:38px;line-height:1.08;letter-spacing:-.02em;margin:auto 0 0;max-width:14ch}
.intro p{margin:0;font-size:14px;line-height:1.6;color:var(--muted);max-width:32ch}
.preview{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.preview div{background:rgba(255,255,255,.12);border:1px solid var(--edge-soft);border-radius:16px;padding:8px 14px 8px 8px;font-size:13px;display:flex;align-items:center;gap:10px}
.preview span.e{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.preview span.e img{width:20px;height:20px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.preview span.t{margin-left:auto;color:var(--muted);font-size:12px}
form{padding:28px 26px;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font-weight:600;font-size:28px;letter-spacing:-.01em}
.sub{margin:0 0 8px;color:var(--muted);font-size:14px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input{background:rgba(255,255,255,.12);border:1px solid var(--edge-soft);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--ink)}
input::placeholder{color:var(--faint)}
input:focus{outline:none;border-color:var(--sun);background:rgba(255,255,255,.16)}
.primary{margin-top:6px;border:0;border-radius:30px;padding:13px;background:var(--sun);color:var(--sun-ink);font-weight:600;cursor:pointer;box-shadow:0 8px 22px rgba(246,199,90,.35)}
.primary:hover{filter:brightness(1.05)}
.primary:disabled{opacity:.6;cursor:wait}
.switch{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
.switch button,.forgot{border:0;background:none;color:var(--sun-text);font-weight:500;cursor:pointer;padding:0}
.forgot{font-size:12px;align-self:flex-end}
.at-wrap{position:relative;display:block}
.at-wrap .at{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.at-wrap input{width:100%;padding-left:32px}
.hint{font-size:11px;color:var(--muted);min-height:15px}
.hint.good{color:#BDF2C4}
.hint.bad{color:var(--danger)}
label[hidden]{display:none}
.msg{font-size:13px;line-height:1.5;border-radius:14px;padding:10px 12px;display:none;border:1px solid var(--edge-soft)}
.msg.error{display:block;background:rgba(210,73,58,.25);color:#FFE3DE}
.msg.ok{display:block;background:rgba(246,199,90,.22);color:var(--ink)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .pane{background:rgba(70,60,52,.85)} }
/* ---------- motion ---------- */
:root{
  --spring:cubic-bezier(.25,1.1,.5,1);
  --spring-soft:cubic-bezier(.22,1,.36,1);
}
@supports (transition-timing-function:linear(0,1)){
  :root{
    --spring:linear(0,.012,.05 3%,.2 7%,.45 12%,.7 18%,.87 25%,.96 32%,1.01 40%,1.02 48%,1.01 60%,1);
    --spring-soft:linear(0,.02,.08 3%,.3 8%,.62 14%,.86 21%,.97 28%,1.005 36%,1.004 46%,1);
  }
}
button{transition:transform .6s var(--spring),background-color .25s ease,box-shadow .3s ease,filter .2s ease,color .2s ease,border-color .2s ease}
button:active:not(:disabled){transform:scale(.97);transition:transform .12s ease-out,background-color .1s}
.fab:hover,.chip:hover,.btn:hover,.alarm-btn:hover,.primary:hover:not(:disabled),.empty button:hover,.nb-done:hover{transform:scale(1.02)}
.arrow:hover,.rail button:hover,.nowbar .nb-btn:hover,button.avatar:hover{transform:scale(1.04)}
.task:active,.pin:active{transform:scale(.993)}
.check:active{transform:scale(.92)}
.day:active{transform:scale(.94)}

@keyframes cardIn{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes swapIn{0%{transform:translateY(4px);opacity:0;filter:blur(2px)}100%{transform:none;opacity:1;filter:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.card{animation:cardIn 1s var(--spring-soft) both}
.preview div{animation:cardIn .9s var(--spring-soft) both}
.preview div:nth-child(1){animation-delay:.25s}
.preview div:nth-child(2){animation-delay:.33s}
.preview div:nth-child(3){animation-delay:.41s}
.swap{animation:swapIn .5s var(--spring-soft)}
.msg.error{animation:shake .45s ease}
.msg.ok{animation:swapIn .5s var(--spring-soft)}
.primary.busy{transform:scale(.97)}
/* ---------- scrollbars ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.26);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.45)}
::-webkit-scrollbar-thumb:active{background-color:rgba(246,199,90,.75)}
@supports not selector(::-webkit-scrollbar){
  *{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
}
/* ---------- liquid glass buttons ---------- */
.lg{--lg-filter:blur(3px);position:relative;isolation:isolate;border:0 !important;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05) 55%,rgba(255,255,255,.11)) !important;
  -webkit-backdrop-filter:var(--lg-filter) saturate(180%) brightness(1.08);backdrop-filter:var(--lg-filter) saturate(180%) brightness(1.08);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.95),inset -1px -1.5px 1px -1px rgba(255,255,255,.45),inset 0 0 12px rgba(255,255,255,.1),0 6px 16px rgba(10,20,40,.14) !important}
.lg::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 90% at 22% 0%,rgba(255,255,255,.38),rgba(255,255,255,0) 46%),radial-gradient(80% 70% at 85% 115%,rgba(255,255,255,.18),rgba(255,255,255,0) 50%)}
.lg:hover{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.09) 55%,rgba(255,255,255,.16)) !important}
.lg:disabled{opacity:.55}
/* tinted (main actions) */
.lg.fab,.lg.btn.primary,.lg.alarm-btn:not(.off),.lg.nb-done,.lg.empty-add,.lg.primary{color:var(--sun-ink) !important;
  background:linear-gradient(180deg,rgba(255,219,130,.9),rgba(246,192,72,.74) 58%,rgba(252,208,105,.86)) !important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 1.5px 1.5px 1px -1px rgba(255,255,255,1),inset -1px -1.5px 1px -1px rgba(255,255,255,.55),inset 0 0 14px rgba(255,255,255,.18),0 8px 22px rgba(246,190,70,.32) !important}
.lg.fab:hover,.lg.btn.primary:hover,.lg.alarm-btn:not(.off):hover,.lg.nb-done:hover,.lg.empty-add:hover,.lg.primary:hover:not(:disabled){
  background:linear-gradient(180deg,rgba(255,226,150,.95),rgba(248,198,84,.82) 58%,rgba(253,214,118,.92)) !important}
.lg.btn.del{color:var(--danger) !important}
/* quiet until hovered: side bar and bottom-bar arrows */
.rail .lg:not(.on):not(:hover),.nowbar .lg.nav:not(:hover){background:transparent !important;box-shadow:none !important;-webkit-backdrop-filter:none;backdrop-filter:none}
.rail .lg:not(.on):not(:hover)::before,.nowbar .lg.nav:not(:hover)::before{opacity:0}
.rail .lg.on{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){
  .card{grid-template-columns:1fr;border-radius:30px}
  .intro{padding:26px}
  .intro h1{font-size:30px;margin-top:14px}
  .preview{display:none}
  form{padding:22px 16px}
}
/* ---------- neutral: no yellow on buttons or background ---------- */
.scene i:nth-child(3){display:none}
.hero::after,.intro::after{display:none}
.lg.fab,.lg.btn.primary,.lg.alarm-btn:not(.off),.lg.nb-done,.lg.empty-add,.lg.primary{color:var(--ink) !important;font-weight:600;
  background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.15) 58%,rgba(255,255,255,.26)) !important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),inset 1.5px 1.5px 1px -1px rgba(255,255,255,1),inset -1px -1.5px 1px -1px rgba(255,255,255,.55),inset 0 0 14px rgba(255,255,255,.16),0 8px 22px rgba(10,20,40,.2) !important}
.lg.fab:hover,.lg.btn.primary:hover,.lg.alarm-btn:not(.off):hover,.lg.nb-done:hover,.lg.empty-add:hover,.lg.primary:hover:not(:disabled){
  background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(255,255,255,.22) 58%,rgba(255,255,255,.34)) !important}
.fab,.primary,.empty button,.nb-done,.btn.primary,.alarm-btn{box-shadow:none}
.day.sel{background:rgba(255,255,255,.88);color:#2A2622}
.day.sel::after{background:#2A2622}
.day.has::after{background:rgba(255,255,255,.85)}
.day.today:not(.sel){box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75)}
.check.on{background:rgba(255,255,255,.9);border-color:transparent;color:#2A2622}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}100%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.emojis button[aria-pressed=true]{background:rgba(255,255,255,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.cat-pick button[aria-pressed=true]{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.18)}
.switch.on{background:rgba(255,255,255,.42)}
input:focus,textarea:focus,select:focus,.gsel-btn[aria-expanded=true]{border-color:rgba(255,255,255,.7) !important}
:focus-visible{outline-color:rgba(255,255,255,.9)}
.link-btn,.forgot,.switch-link,.switch button{color:var(--ink) !important;font-weight:600}
.gsel-opt .tick{color:var(--ink)}
.user-trigger:hover .avatar{box-shadow:0 0 0 3px rgba(255,255,255,.4)}
.alarm-emoji{background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 0 0 10px rgba(255,255,255,.1)}
.eyebrow b{background:rgba(255,255,255,.85)}
.msg.ok{background:rgba(255,255,255,.16)}
::-webkit-scrollbar-thumb:active{background-color:rgba(255,255,255,.65)}
/* ---------- softer, darker glass ---------- */
.lg{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(20,16,12,.1) 55%,rgba(255,255,255,.03)) !important;
  -webkit-backdrop-filter:var(--lg-filter) saturate(140%) brightness(.84);backdrop-filter:var(--lg-filter) saturate(140%) brightness(.84);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.6),inset -1px -1.5px 1px -1px rgba(255,255,255,.25),inset 0 0 10px rgba(255,255,255,.05),0 6px 16px rgba(10,20,40,.16) !important}
.lg::before{opacity:.5}
.lg:hover{background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(20,16,12,.05) 55%,rgba(255,255,255,.07)) !important}
.lg.fab,.lg.btn.primary,.lg.alarm-btn:not(.off),.lg.nb-done,.lg.empty-add,.lg.primary{
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(20,16,12,.06) 58%,rgba(255,255,255,.08)) !important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.24),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.75),inset -1px -1.5px 1px -1px rgba(255,255,255,.3),inset 0 0 12px rgba(255,255,255,.07),0 8px 20px rgba(10,20,40,.2) !important}
.lg.fab:hover,.lg.btn.primary:hover,.lg.alarm-btn:not(.off):hover,.lg.nb-done:hover,.lg.empty-add:hover,.lg.primary:hover:not(:disabled){
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 58%,rgba(255,255,255,.12)) !important}
.rail .lg:not(.on):not(:hover),.nowbar .lg.nav:not(:hover){background:transparent !important;box-shadow:none !important;-webkit-backdrop-filter:none;backdrop-filter:none}
.lens{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(20,16,12,.1) 55%,rgba(255,255,255,.03));
  -webkit-backdrop-filter:blur(2px) saturate(140%) brightness(.84);backdrop-filter:blur(2px) saturate(140%) brightness(.84) !important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.65),inset -1px -1.5px 1px -1px rgba(255,255,255,.28),inset 0 0 10px rgba(255,255,255,.06),0 6px 16px rgba(10,20,40,.16)}
.lens::before{opacity:.5}
.lens::after{border-color:rgba(255,255,255,.06);border-top-color:rgba(255,255,255,.28)}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="card pane">
  <section class="intro">
    <div class="brand"><span class="mark">✓</span> Daybook</div>
    <h1>Plan your day, from any device.</h1>
    <p>Sign in to see your schedule, pinned tasks, and progress wherever you left off.</p>
    <div class="preview" aria-hidden="true">
      <div><span class="e"><img src="emoji/lotus.png" alt="🧘" onerror="this.replaceWith(this.alt)"></span>Morning stretch<span class="t">7:30 AM</span></div>
      <div><span class="e"><img src="emoji/briefcase.png" alt="💼" onerror="this.replaceWith(this.alt)"></span>Team check-in<span class="t">10:00 AM</span></div>
      <div><span class="e"><img src="emoji/game.png" alt="🎮" onerror="this.replaceWith(this.alt)"></span>Game night<span class="t">8:00 PM</span></div>
    </div>
  </section>

  <form id="form" novalidate>
    <h2 id="title">Welcome back</h2>
    <p class="sub" id="subtitle">Sign in to your account.</p>
    <div class="msg" id="msg" role="status"></div>
    <label id="userField" hidden>Username
      <span class="at-wrap"><span class="at">@</span><input type="text" id="username" autocomplete="username" maxlength="20" spellcheck="false" autocapitalize="off" placeholder="yourname"></span>
      <span class="hint" id="userHint">3–20 characters: letters, numbers, dots, underscores</span>
    </label>
    <label><span id="idLabel">Email or username</span><input type="text" id="email" autocomplete="username" spellcheck="false" autocapitalize="off" required></label>
    <label>Password<input type="password" id="password" autocomplete="current-password" minlength="6" required></label>
    <button type="button" class="forgot" id="forgotBtn">Forgot password?</button>
    <button type="submit" class="primary" id="submitBtn">Sign in</button>
    <p class="switch"><span id="switchText">New here?</span> <button type="button" id="switchBtn">Create an account</button></p>
  </form>
</main>

<script>
(async function(){
  const $=id=>document.getElementById(id);
  // liquid glass button
  // Edge-bending (SVG displacement) is turned off: browsers currently place the effect
// off-target and leave visible smears. The glass look comes from CSS instead.
const LENS_REFRACT=false;
  const lensDefs=(()=>{
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("aria-hidden","true");
    svg.style.cssText="position:absolute;width:0;height:0;overflow:hidden";
    svg.innerHTML="<defs></defs>";
    document.body.appendChild(svg);
    return svg.firstChild;
  })();
  const lensCache={};
  // displacement map: pixels near the capsule edge sample from further out, which bends the content like a glass lens
  function lensFilter(w,h){
    w=Math.round(w); h=Math.round(h);
    const key=w+"x"+h;
    if(lensCache[key])return lensCache[key];
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    const ctx=c.getContext("2d"), img=ctx.createImageData(w,h), d=img.data;
    const r=Math.min(w,h)/2, band=Math.max(4,r*0.9);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const px=x+.5, py=y+.5;
      const cx=w>=h?Math.min(Math.max(px,r),w-r):w/2, cy=w>=h?h/2:Math.min(Math.max(py,r),h-r);
      const dx=px-cx, dy=py-cy, dist=Math.hypot(dx,dy), edge=r-dist;
      let k=0,nx=0,ny=0;
      if(dist>0){nx=dx/dist;ny=dy/dist}
      if(edge>=0&&edge<band){const t=1-edge/band;k=t*t*t}
      else if(edge<0)k=1;
      const i=(y*w+x)*4;
      d[i]=128+nx*k*127; d[i+1]=128+ny*k*127; d[i+2]=128; d[i+3]=255;
    }
    ctx.putImageData(img,0,0);
    const id="lens-"+key;
    const f=document.createElementNS("http://www.w3.org/2000/svg","filter");
    f.setAttribute("id",id);
    for(const [k,v] of Object.entries({x:0,y:0,width:w,height:h,filterUnits:"userSpaceOnUse",primitiveUnits:"userSpaceOnUse","color-interpolation-filters":"sRGB"}))f.setAttribute(k,v);
    f.innerHTML=`<feImage href="${c.toDataURL()}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="map"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.4" result="soft"/>
      <feDisplacementMap in="soft" in2="map" scale="${Math.round(h*0.85)}" xChannelSelector="R" yChannelSelector="G"/>`;
    lensDefs.appendChild(f);
    return lensCache[key]=`url(#${id})`;
  }
  
  (()=>{
    const el=$("submitBtn"); el.classList.add("lg");
    if(!LENS_REFRACT||!window.ResizeObserver)return;
    let key="";
    new ResizeObserver(()=>{const w=el.offsetWidth,h=el.offsetHeight;if(!w||!h)return;const k=w+"x"+h;if(k===key)return;key=k;el.style.setProperty("--lg-filter",lensFilter(w,h)+" blur(.6px)")}).observe(el);
  })();
  // Apple devices already have Apple's emoji, so use those there
  if(/Mac|iPhone|iPad|iPod/i.test((navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||navigator.userAgent||""))
    document.querySelectorAll(".preview img").forEach(i=>i.replaceWith(i.alt));
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const APP="index.html";

  // Already signed in? Go straight to the app.
  const {data:{session}}=await sb.auth.getSession();
  if(session){location.replace(APP);return}
  sb.auth.onAuthStateChange((event,s)=>{if(s&&event==="SIGNED_IN")location.replace(APP)});

  let mode="signin";
  const USER_RE=/^[a-z0-9_.]{3,20}$/;
  const cleanName=v=>v.trim().replace(/^@/,"").toLowerCase();
  function show(type,text){const m=$("msg");m.className="msg";void m.offsetWidth;m.className="msg "+type;m.textContent=text}
  function hint(text,kind){const h=$("userHint");h.textContent=text;h.className="hint"+(kind?" "+kind:"")}
  function setMode(next){
    mode=next;
    ["title","subtitle","submitBtn","switchText"].forEach(id=>{const el=$(id);el.classList.remove("swap");void el.offsetWidth;el.classList.add("swap")});
    const up=mode==="signup";
    $("title").textContent=up?"Create your account":"Welcome back";
    $("subtitle").textContent=up?"Pick a username and a password with at least 6 characters.":"Sign in with your email or username.";
    $("submitBtn").textContent=up?"Create account":"Sign in";
    $("switchText").textContent=up?"Already have an account?":"New here?";
    $("switchBtn").textContent=up?"Sign in":"Create an account";
    $("password").autocomplete=up?"new-password":"current-password";
    $("forgotBtn").style.display=up?"none":"";
    $("userField").hidden=!up;
    $("idLabel").textContent=up?"Email":"Email or username";
    $("email").type=up?"email":"text";
    $("email").autocomplete=up?"email":"username";
    $("msg").className="msg";
  }
  $("switchBtn").onclick=()=>setMode(mode==="signin"?"signup":"signin");
  setMode("signin");
  $("title").classList.remove("swap");

  // live username availability while signing up
  let checkTimer=null, lastChecked="", lastFree=false;
  async function checkName(name){
    const {data,error}=await sb.rpc("username_available",{p_username:name});
    if(error){hint("Couldn't check that username right now.","bad");return null}
    lastChecked=name; lastFree=!!data;
    if(cleanName($("username").value)===name) hint(data?"@"+name+" is available":"@"+name+" is taken",data?"good":"bad");
    return !!data;
  }
  $("username").addEventListener("input",()=>{
    const el=$("username"), pos=el.selectionStart, low=el.value.toLowerCase().replace(/\s/g,"");
    if(low!==el.value){el.value=low;try{el.setSelectionRange(pos,pos)}catch(e){}}
    const name=cleanName(el.value);
    clearTimeout(checkTimer);
    if(!name){hint("3–20 characters: letters, numbers, dots, underscores");return}
    if(!USER_RE.test(name)){hint("Use 3–20 characters: letters, numbers, dots, or underscores.","bad");return}
    hint("Checking…");
    checkTimer=setTimeout(()=>checkName(name),400);
  });

  $("forgotBtn").onclick=async()=>{
    const email=$("email").value.trim();
    if(!email.includes("@")){show("error","Enter your email address (not your username), then select Forgot password.");$("email").focus();return}
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/"+APP});
    error?show("error",error.message):show("ok","Check your inbox for a password reset link.");
  };

  $("form").addEventListener("submit",async e=>{
    e.preventDefault();
    const id=$("email").value.trim(), password=$("password").value;
    if(password.length<6){show("error","Password must be at least 6 characters.");return}

    $("submitBtn").disabled=true; $("submitBtn").classList.add("busy");
    try{
      if(mode==="signup"){
        const username=cleanName($("username").value);
        if(!USER_RE.test(username)){show("error","Choose a username with 3–20 letters, numbers, dots, or underscores.");$("username").focus();return}
        if(!id.includes("@")){show("error","Enter a valid email address.");$("email").focus();return}
        const free=lastChecked===username?lastFree:await checkName(username);
        if(free===false){show("error","@"+username+" is already taken. Try another username.");$("username").focus();return}
        const {data,error}=await sb.auth.signUp({email:id,password,options:{data:{username},emailRedirectTo:location.origin+"/"+APP}});
        if(error){
          if(/database error/i.test(error.message))throw new Error("@"+username+" was just taken. Try another username.");
          throw error;
        }
        if(data.session){location.replace(APP);return}
        setMode("signin");
        $("email").value=username;
        show("ok","Account created. Open the confirmation link in your email, then sign in here as @"+username+".");
      }else{
        if(!id){show("error","Enter your email or username.");$("email").focus();return}
        let email=id;
        if(!id.includes("@")||id.startsWith("@")){
          const name=cleanName(id);
          const {data,error}=await sb.rpc("email_for_login",{p_username:name,p_password:password});
          if(error){
            if(/too_many_attempts/.test(error.message))throw new Error("Too many wrong passwords for @"+name+". Wait 15 minutes, or sign in with your email.");
            throw new Error("Couldn't sign in with a username right now: "+error.message);
          }
          if(!data)throw new Error("Username or password is incorrect.");
          email=data;
        }
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error)throw error;
        location.replace(APP);
      }
    }catch(err){
      const m=err.message||"";
      show("error",m==="Invalid login credentials"?"Email, username, or password is incorrect.":m==="Email not confirmed"?"Confirm your email first using the link we sent you.":m);
    }finally{
      $("submitBtn").disabled=false; $("submitBtn").classList.remove("busy");
    }
  });
})();
</script>
</body>
</html>
