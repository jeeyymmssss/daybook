<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --scene-a:#968878; --scene-b:#5E534A; --scene-c:#BFB2A3; --scene-d:#8A9486;
  --glass:rgba(255,255,255,.13); --glass-strong:rgba(255,255,255,.2); --glass-hover:rgba(255,255,255,.24);
  --edge:rgba(255,255,255,.32); --edge-soft:rgba(255,255,255,.14);
  --ink:#FFFFFF; --muted:rgba(255,255,255,.72); --faint:rgba(255,255,255,.38); --line:rgba(255,255,255,.18);
  --sun:#F6C75A; --sun-ink:#3B2C06; --sun-text:#FFD980; --danger:#FFB4A8;
  --blur:blur(28px) saturate(150%);
  --lift:0 24px 60px rgba(30,22,15,.28), inset 0 1px 0 rgba(255,255,255,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --scene-a:#3A342F; --scene-b:#15130F; --scene-c:#5C5046; --scene-d:#2E3A33;
    --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12); --glass-hover:rgba(255,255,255,.16);
    --edge:rgba(255,255,255,.18); --edge-soft:rgba(255,255,255,.08);
    --lift:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  }
}
:root[data-theme="dark"]{
  --scene-a:#3A342F; --scene-b:#15130F; --scene-c:#5C5046; --scene-d:#2E3A33;
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12); --glass-hover:rgba(255,255,255,.16);
  --edge:rgba(255,255,255,.18); --edge-soft:rgba(255,255,255,.08);
  --lift:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html{background:var(--scene-b)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Lexend,"Segoe UI",system-ui,sans-serif;font-weight:400;position:relative;overflow-x:hidden}
/* the soft "room" behind the glass */
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(60% 50% at 18% 20%, var(--scene-c) 0%, transparent 70%),
    radial-gradient(45% 45% at 85% 85%, var(--scene-d) 0%, transparent 70%),
    linear-gradient(160deg,var(--scene-a) 0%,var(--scene-b) 100%);}
.scene i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.scene i:nth-child(1){width:42vw;height:42vw;left:-8vw;bottom:-14vw;background:#D9CAB6}
.scene i:nth-child(2){width:30vw;height:30vw;right:6vw;top:-8vw;background:#C7B39E}
.scene i:nth-child(3){width:22vw;height:22vw;left:44vw;top:40vh;background:#F6C75A;opacity:.18}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.18));}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.pane{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge-soft);border-top-color:var(--edge);box-shadow:var(--lift)}
body{padding:20px 20px 110px 100px}
body.checking .app,body.checking .rail,body.checking .nowbar{visibility:hidden}

/* floating rail */
.rail{position:fixed;left:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:40px;z-index:5}
.rail button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.rail button:hover{background:var(--glass-hover);color:var(--ink)}
.rail button.on{background:var(--glass-strong);color:var(--ink)}
.rail svg{width:19px;height:19px}

.app{display:grid;grid-template-columns:290px minmax(0,1fr) 290px;gap:18px;min-height:calc(100vh - 130px)}
.side,.main{border-radius:32px}
.side{padding:28px 20px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;padding:0 8px}
.brand-mark{width:28px;height:28px;border-radius:50% 50% 50% 12px;background:var(--sun);display:grid;place-items:center;color:var(--sun-ink);font-size:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px}
.sec-head h2,.cal-head h2{font-size:15px;font-weight:500;margin:0}
.link{color:var(--muted);font-size:12px}
.pins{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pin{border-radius:16px;padding:12px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.pin:hover{background:var(--glass-hover)}
.pin:first-child:not(.add){background:var(--glass-strong);border:1px solid var(--edge-soft)}
.icon{width:36px;height:36px;flex:none;border-radius:11px;background:var(--glass-strong);border:1px solid var(--edge-soft);display:grid;place-items:center;font-size:18px}
.pin-title{font-weight:500;font-size:14px}
.pin-meta{font-size:12px;color:var(--muted);margin-top:3px}
.tag{display:inline-block;margin-top:8px;background:var(--glass-strong);border:1px solid var(--edge-soft);font-size:11px;padding:2px 9px;border-radius:20px}
.pin-notes{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.pin.add{align-items:center;font-size:14px;color:var(--muted)}
.pin.add .icon{background:transparent;border-style:dashed;border-color:var(--faint);color:var(--ink)}

.cal-head{display:flex;align-items:center;gap:8px;padding:0 8px}
.cal-head h2{margin-right:auto;white-space:nowrap}
.arrow{width:30px;height:30px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--edge-soft);display:grid;place-items:center;font-size:13px}
.arrow:hover{background:var(--glass-hover)}
.cal{border-radius:20px;padding:14px 10px;margin-top:12px;background:rgba(255,255,255,.06);border:1px solid var(--edge-soft)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.dow{font-size:10px;color:var(--muted);padding-bottom:6px}
.day{position:relative;aspect-ratio:1;border-radius:50%;font-size:12px;display:grid;place-items:center}
.day.out{color:var(--faint)}
.day.has::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--sun)}
.day.sel{background:var(--sun);color:var(--sun-ink);font-weight:600}
.day.sel::after{background:var(--sun-ink)}
.day.today:not(.sel){box-shadow:inset 0 0 0 1.5px var(--sun)}
.day:hover:not(.sel){background:var(--glass-hover)}

/* main pane */
.main{padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{border-radius:24px;padding:26px 28px;display:flex;align-items:flex-end;gap:20px;background:linear-gradient(120deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid var(--edge-soft);position:relative;overflow:hidden;min-height:170px}
.hero::after{content:"";position:absolute;right:-60px;bottom:-120px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(246,199,90,.4),rgba(246,199,90,0) 70%);pointer-events:none}
.hero-top{position:absolute;top:18px;right:18px;display:flex;gap:8px;align-items:center;z-index:1}
.eyebrow{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.eyebrow b{width:8px;height:8px;border-radius:50%;background:var(--sun);display:inline-block}
.main-head h1{font-size:clamp(30px,4vw,46px);font-weight:600;margin:0;letter-spacing:-.02em;line-height:1.05}
.date-big{font-size:14px;color:var(--muted);margin-top:8px;display:block}
.hero-actions{display:flex;gap:10px;align-items:center;padding:0 4px}
.fab{border-radius:30px;background:var(--sun);color:var(--sun-ink);font-weight:500;font-size:14px;padding:10px 20px;display:flex;gap:6px;align-items:center;box-shadow:0 8px 20px rgba(246,199,90,.35)}
.fab:hover{filter:brightness(1.05)}
.chip{border-radius:30px;background:var(--glass-strong);border:1px solid var(--edge-soft);font-size:13px;padding:10px 18px}
.chip:hover{background:var(--glass-hover)}
.hero-actions .spacer{flex:1}
.list-title{font-size:15px;font-weight:500;margin:4px 4px -6px}
.timeline{display:flex;flex-direction:column;gap:4px}
.row{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center}
.check{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--sun-ink);font-size:13px;border:1.5px solid var(--faint);margin-left:4px}
.check:hover{border-color:var(--ink)}
.check.on{background:var(--sun);border-color:var(--sun)}
.task{border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;text-align:left;width:100%;align-items:center}
.task:hover{background:var(--glass-hover)}
.task.done .t-title{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}
.task .icon{width:42px;height:42px;border-radius:10px;font-size:20px}
.t-title{font-weight:500;font-size:14px}
.t-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6;white-space:pre-line}
.t-time{font-size:12px;color:var(--muted);text-align:right;line-height:1.6;white-space:nowrap;font-variant-numeric:tabular-nums}
.bell{display:block;font-size:11px}
.empty{border:1.5px dashed var(--faint);border-radius:18px;padding:36px 24px;text-align:center;color:var(--muted);font-size:14px}
.empty button{margin-top:14px;background:var(--sun);color:var(--sun-ink);border-radius:20px;padding:9px 18px;font-weight:500;font-size:13px}

/* right column */
.right{display:flex;flex-direction:column;gap:14px}
.user{border-radius:40px;padding:8px 8px 8px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;align-self:stretch}
.user-name{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.theme-btn{color:var(--muted);font-size:11px}
.theme-btn:hover{color:var(--ink)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--edge-soft);display:grid;place-items:center;font-size:18px;flex:none}
.widget{border-radius:26px;padding:20px}
.clock{font-size:40px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.w-sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none}
.ring-num{font-size:24px;font-weight:500}
.next{display:flex;gap:12px;align-items:center;margin-top:12px}
.next .icon{width:34px;height:34px;font-size:16px}
.w-title{font-size:14px;font-weight:500}
.alarm-widget label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.alarm-btn{margin-top:10px;border-radius:30px;padding:10px 14px;background:var(--sun);color:var(--sun-ink);font-weight:500;font-size:13px;width:100%}
.alarm-btn.off{background:var(--glass-strong);color:var(--ink);border:1px solid var(--edge-soft)}
.link-btn{color:var(--sun-text);font-weight:500;font-size:12px}
.status{font-size:11px;color:var(--muted);margin-top:auto;padding:0 8px;line-height:1.5}

/* floating now bar */
.nowbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(620px,calc(100vw - 40px));border-radius:40px;padding:8px;display:flex;align-items:center;gap:8px;z-index:5}
.nowbar .nb-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.nowbar .nb-btn:hover{background:var(--glass-hover)}
.nowbar svg{width:18px;height:18px}
.nb-track{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid var(--edge-soft);border-radius:30px;padding:5px 14px 5px 5px}
.nb-track .icon{width:34px;height:34px;border-radius:50%;font-size:16px}
.nb-text{min-width:0}
.nb-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-sub{font-size:11px;color:var(--muted)}
.nb-bar{height:3px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden;width:140px;max-width:100%}
.nb-bar i{display:block;height:100%;background:var(--sun);width:0}
.nb-done{border-radius:30px !important;width:auto !important;padding:0 16px;background:var(--sun);color:var(--sun-ink);font-weight:500;font-size:13px}
.nb-done:hover{filter:brightness(1.05);background:var(--sun) !important}

/* dialogs */
dialog{border:1px solid var(--edge);border-radius:28px;padding:0;color:var(--ink);width:min(440px,92vw);background:rgba(90,78,68,.55);-webkit-backdrop-filter:blur(36px) saturate(160%);backdrop-filter:blur(36px) saturate(160%);box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(20,16,12,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
form{padding:26px;display:flex;flex-direction:column;gap:14px}
form h3{margin:0 0 4px;font-weight:600;font-size:20px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=date],input[type=time],textarea,select{background:rgba(255,255,255,.12);border:1px solid var(--edge-soft);border-radius:12px;padding:10px 12px;font-size:14px;width:100%;color:var(--ink);color-scheme:dark}
option{color:#222;background:#fff}
input:focus,textarea:focus,select:focus{border-color:var(--sun);outline:none}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);font-size:18px}
.emojis button[aria-pressed=true]{background:var(--sun)}
.check-line{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13px}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{border-radius:30px;padding:10px 18px;font-weight:500;font-size:14px}
.btn.primary{background:var(--sun);color:var(--sun-ink);margin-left:auto}
.btn.ghost{background:rgba(255,255,255,.14);border:1px solid var(--edge-soft)}
.btn.del{color:var(--danger)}
.alarm-box{padding:30px 26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.alarm-emoji{width:76px;height:76px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:34px;animation:ring 1s ease-in-out infinite;box-shadow:0 0 0 10px rgba(246,199,90,.2)}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}
.alarm-box h3{margin:6px 0 0;font-weight:600;font-size:22px}
.alarm-box .actions{width:100%;flex-wrap:wrap}
.alarm-box .btn{flex:1}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .pane{background:rgba(70,60,52,.82)}
}
@media (max-width:1150px){
  .app{grid-template-columns:270px minmax(0,1fr)}
  .right{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .user{grid-column:1/-1}
}
@media (max-width:760px){
  body{padding:14px 14px 96px}
  .rail{display:none}
  .app{grid-template-columns:1fr}
  .main{order:-1;padding:14px}
  .hero{padding:22px 20px;min-height:140px}
  .hero-top{top:14px;right:14px}
  .nb-bar{display:none}
  .nowbar .nb-btn.nav{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="checking">
<div class="scene" aria-hidden="true"><i></i><i></i><i></i></div>
<nav class="rail pane" aria-label="Quick actions">
  <button id="railToday" class="on" title="Go to today" aria-label="Go to today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
  <button id="railAdd" title="Add task" aria-label="Add task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="railAlarm" title="Alarms" aria-label="Alarm settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
  <button id="railTheme" title="Switch theme" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
</nav>
<div class="app">
  <aside class="side pane">
    <div class="brand"><span class="brand-mark">✓</span> Daybook</div>

    <section>
      <div class="sec-head"><h2>Pinned</h2><span class="link" id="pinCount"></span></div>
      <div class="pins" id="pins"></div>
    </section>

    <section>
      <div class="cal-head">
        <h2 id="calTitle"></h2>
        <button class="arrow" id="calPrev" aria-label="Previous month">←</button>
        <button class="arrow" id="calNext" aria-label="Next month">→</button>
      </div>
      <div class="cal"><div class="cal-grid" id="cal"></div></div>
    </section>
  </aside>

  <main class="main pane">
    <div class="hero main-head">
      <div class="hero-top">
        <button class="arrow" id="dayPrev" aria-label="Previous day">←</button>
        <button class="arrow" id="dayNext" aria-label="Next day">→</button>
      </div>
      <div>
        <div class="eyebrow"><b></b><span id="heroEyebrow">Today</span></div>
        <h1 id="heading">Schedule</h1>
        <span class="date-big" id="dateBig"></span>
      </div>
    </div>
    <div class="hero-actions">
      <button class="fab" id="addBtn"><span aria-hidden="true">+</span> Add task</button>
      <button class="chip" id="todayBtn">Go to today</button>
    </div>
    <div class="list-title">Schedule</div>
    <div class="timeline" id="timeline"></div>
  </main>

  <aside class="right">
    <div class="user pane">
      <div>
        <div class="user-name" id="userEmail">My day</div>
        <button class="theme-btn" id="themeBtn">Switch theme</button> ·
        <button class="theme-btn" id="signOutBtn">Sign out</button>
      </div>
      <div class="avatar" aria-hidden="true">🌤️</div>
    </div>
    <div class="widget pane">
      <div class="clock" id="clock">--:--</div>
      <div class="w-sub" id="greeting"></div>
    </div>
    <div class="widget pane">
      <div class="ring">
        <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
          <circle cx="28" cy="28" r="23" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="6"/>
          <circle id="ringArc" cx="28" cy="28" r="23" fill="none" stroke="var(--sun)" stroke-width="6" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="144.5" transform="rotate(-90 28 28)" style="transition:stroke-dashoffset .4s"/>
        </svg>
        <div><div class="ring-num" id="ringNum">0/0</div><div class="w-sub">done this day</div></div>
      </div>
    </div>
    <div class="widget pane">
      <div class="w-title">Coming up</div>
      <div id="nextUp"></div>
    </div>
    <div class="widget pane alarm-widget" id="alarmCard">
      <div class="w-title">Alarms</div>
      <div class="w-sub" id="alarmInfo">Alarms are off on this device.</div>
      <label style="margin-top:12px">Alarm sound
        <select id="soundSel">
          <option value="pulse">Pulse</option>
          <option value="sunrise">Sunrise</option>
          <option value="chime">Chime</option>
          <option value="classic">Classic beep</option>
          <option value="custom">My own sound…</option>
        </select>
      </label>
      <div id="customRow" class="w-sub" style="display:none"></div>
      <input type="file" id="soundFile" accept="audio/*" hidden>
      <button class="alarm-btn off" id="previewBtn" style="margin-top:8px">Play sound</button>
      <button class="alarm-btn" id="alarmToggle">Turn on alarms</button>
    </div>
    <div class="status" id="status">Loading your tasks…</div>
  </aside>
</div>

<div class="nowbar pane" aria-live="polite">
  <button class="nb-btn nav" id="nbPrev" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="nb-track">
    <span class="icon" id="nbIcon">☀️</span>
    <div class="nb-text">
      <div class="nb-title" id="nbTitle">Nothing else today</div>
      <div class="nb-sub" id="nbSub">Add a task to plan ahead</div>
      <div class="nb-bar"><i id="nbBar"></i></div>
    </div>
  </div>
  <button class="nb-btn nav" id="nbNext" aria-label="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
  <button class="nb-btn nb-done" id="nbDone" hidden>Done</button>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3 id="formTitle">New task</h3>
    <label>Title<input type="text" id="fTitle" required maxlength="80" placeholder="e.g. Morning run"></label>
    <div class="two">
      <label>Date<input type="date" id="fDate" required></label>
      <label>Tag<select id="fTag"><option>Personal</option><option>Work</option><option>Health</option><option>Errand</option></select></label>
    </div>
    <div class="two">
      <label>Start<input type="time" id="fTime"></label>
      <label>End<input type="time" id="fEnd"></label>
    </div>
    <label>Icon<div class="emojis" id="emojis"></div></label>
    <label>Notes (one item per line)<textarea id="fNotes" maxlength="400"></textarea></label>
    <label>Reminder<select id="fRemind">
      <option value="0">At start time</option>
      <option value="5">5 minutes before</option>
      <option value="10">10 minutes before</option>
      <option value="15">15 minutes before</option>
      <option value="30">30 minutes before</option>
      <option value="60">1 hour before</option>
      <option value="-1">No alarm</option>
    </select></label>
    <label class="check-line"><input type="checkbox" id="fPin"> Pin to sidebar</label>
    <div class="actions">
      <button type="button" class="btn del" id="delBtn">Delete</button>
      <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary" id="saveBtn">Save task</button>
    </div>
  </form>
</dialog>

<dialog id="alarmDlg" aria-labelledby="alarmTitle">
  <div class="alarm-box">
    <div class="alarm-emoji" id="alarmEmoji">⏰</div>
    <h3 id="alarmTitle"></h3>
    <div class="w-sub" id="alarmWhen"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="snoozeBtn">Snooze 5 min</button>
      <button type="button" class="btn ghost" id="dismissBtn">Dismiss</button>
      <button type="button" class="btn primary" id="alarmDoneBtn">Mark done</button>
    </div>
  </div>
</dialog>

<script>
(async function(){
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const {data:{session}}=await sb.auth.getSession();
if(!session){location.replace("login.html");return}
document.body.classList.remove("checking");

const EMOJIS=["⏰","🧘","🏋️","💼","🍣","🎨","📞","🎂","📚","🛒","🧹","💊"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime=t=>{if(!t)return"";let[h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+pad(m)+" "+ap};
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

let tasks=[];
let selected=iso(new Date());
let calMonth=new Date(); calMonth.setDate(1);
let editingId=null, chosenEmoji=EMOJIS[0];

function uid(){return (crypto.randomUUID?crypto.randomUUID():"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,9))}
const fromRow=r=>({id:r.id,title:r.title,date:r.date,time:r.time||"",end:r.end_time||"",emoji:r.emoji||"📚",tag:r.tag||"Personal",notes:r.notes||"",pinned:!!r.pinned,done:!!r.done,remind:(r.remind===null||r.remind===undefined)?0:Number(r.remind)});
const toRow=t=>({id:t.id,title:t.title,date:t.date,time:t.time||null,end_time:t.end||null,emoji:t.emoji,tag:t.tag,notes:t.notes,pinned:t.pinned,done:t.done,remind:t.remind});
function setStatus(msg){$("status").textContent=msg}

async function persist(task){
  const {error}=await sb.from("tasks").upsert(toRow(task));
  setStatus(error?"Couldn't save \""+task.title+"\": "+error.message:"All changes saved.");
}
async function remove(id){
  const {error}=await sb.from("tasks").delete().eq("id",id);
  setStatus(error?"Couldn't delete that task: "+error.message:"All changes saved.");
}

/* ---------- render ---------- */
function sortTasks(list){return list.slice().sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"))}

function renderTimeline(){
  const d=parse(selected), today=iso(new Date());
  const diff=Math.round((d-parse(today))/864e5);
  $("heroEyebrow").textContent=diff===0?"Today":diff===1?"Tomorrow":diff===-1?"Yesterday":diff>0?"In "+diff+" days":Math.abs(diff)+" days ago";
  $("heading").textContent=DAYS[d.getDay()]+" "+d.getDate();
  $("todayBtn").hidden=diff===0;
  $("railToday").classList.toggle("on",diff===0);
  const list=sortTasks(tasks.filter(t=>t.date===selected));
  const el=$("timeline");
  if(!list.length){
    el.innerHTML=`<div class="empty">Nothing planned for this day.<br><button type="button" id="emptyAdd">Add a task</button></div>`;
    $("emptyAdd").onclick=()=>openForm();
  } else {
    el.innerHTML=list.map(t=>{
      const notes=t.notes?`<div class="t-sub">${esc(t.notes.split("\n").filter(Boolean).map(l=>t.notes.includes("\n")?"• "+l:l).join("\n"))}</div>`:"";
      return `<div class="row">
        <button class="check ${t.done?"on":""}" data-toggle="${t.id}" aria-label="${t.done?"Mark not done":"Mark done"}: ${esc(t.title)}">${t.done?"✓":""}</button>
        <button class="task ${t.done?"done":""}" data-edit="${t.id}">
          <span class="icon">${esc(t.emoji)}</span>
          <span><div class="t-title">${esc(t.title)}</div>${notes}</span>
          <span class="t-time">${fmtTime(t.time)}${t.end?"<br>"+fmtTime(t.end):""}${t.remind>=0&&t.time?`<span class="bell" title="Reminder set">🔔 ${t.remind?t.remind+"m before":"on time"}</span>`:""}</span>
        </button></div>`;
    }).join("");
  }
  const done=list.filter(t=>t.done).length, total=list.length;
  $("dateBig").textContent=MONTHS[d.getMonth()]+" "+d.getFullYear()+" · "+(total?`${total} task${total>1?"s":""}, ${done} done`:"No tasks yet");
  $("ringNum").textContent=done+"/"+total;
  $("ringArc").setAttribute("stroke-dashoffset",total?144.5*(1-done/total):144.5);
}

function renderPins(){
  const pins=sortTasks(tasks.filter(t=>t.pinned)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
  $("pinCount").textContent=pins.length?`${tasks.filter(t=>t.pinned).length} pinned`:"";
  $("pins").innerHTML=pins.map(t=>{
    const d=parse(t.date);
    return `<button class="pin" data-jump="${t.id}">
      <span class="icon">${esc(t.emoji)}</span>
      <span><div class="pin-title">${esc(t.title)}</div>
      <div class="pin-meta">${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}${t.time?" · "+fmtTime(t.time):""}</div>
      <span class="tag">${esc(t.tag)}</span>
      ${t.notes?`<div class="pin-notes">${esc(t.notes.split("\n")[0])}</div>`:""}</span>
    </button>`}).join("")+
    `<button class="pin add" id="addPin"><span class="icon">+</span>Add a pinned task</button>`;
  $("addPin").onclick=()=>openForm(null,true);
}

function renderCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  $("calTitle").textContent=MONTHS[m]+", "+y;
  const first=new Date(y,m,1), offset=(first.getDay()+6)%7;
  const start=new Date(y,m,1-offset);
  const withTasks=new Set(tasks.map(t=>t.date));
  const today=iso(new Date());
  let html=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    if(i===35 && d.getMonth()!==m) break;
    const k=iso(d);
    const cls=["day",d.getMonth()!==m&&"out",withTasks.has(k)&&"has",k===selected&&"sel",k===today&&"today"].filter(Boolean).join(" ");
    html+=`<button class="${cls}" data-day="${k}" aria-label="${d.toDateString()}">${d.getDate()}</button>`;
  }
  $("cal").innerHTML=html;
}

function renderNext(){
  const now=new Date(), today=iso(now), hm=pad(now.getHours())+":"+pad(now.getMinutes());
  const up=sortTasks(tasks.filter(t=>!t.done && (t.date>today || (t.date===today && (!t.time||t.time>=hm)))))
    .sort((a,b)=>a.date.localeCompare(b.date))[0];
  $("nextUp").innerHTML=up?`<div class="next"><span class="icon">${esc(up.emoji)}</span><div><div class="w-title">${esc(up.title)}</div><div class="w-sub" style="margin-top:2px">${up.date===today?"Today":parse(up.date).toDateString().slice(0,10)}${up.time?" · "+fmtTime(up.time):""}</div></div></div>`
    :`<div class="w-sub">You're all caught up.</div>`;
}

let nowTask=null;
function renderNowBar(){
  const n=new Date(), today=iso(n), mins=n.getHours()*60+n.getMinutes();
  const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
  const todays=sortTasks(tasks.filter(t=>t.date===today&&t.time&&!t.done));
  let cur=null,frac=0;
  for(const t of todays){
    const st=toMin(t.time), en=t.end?toMin(t.end):st+60;
    if(st<=mins&&mins<en){cur=t;frac=(mins-st)/Math.max(1,en-st)}
  }
  const next=todays.find(t=>toMin(t.time)>mins);
  const show=cur||next;
  nowTask=show||null;
  $("nbIcon").textContent=show?show.emoji:"☀️";
  $("nbTitle").textContent=show?show.title:"Nothing else today";
  $("nbSub").textContent=cur?"Now · until "+fmtTime(cur.end||(()=>{const e=toMin(cur.time)+60;return pad(Math.floor(e/60)%24)+":"+pad(e%60)})()):next?"Next · "+fmtTime(next.time):"Add a task to plan ahead";
  $("nbBar").style.width=cur?Math.round(frac*100)+"%":"0%";
  $("nbDone").hidden=!show;
}
function render(){renderTimeline();renderPins();renderCal();renderNext();renderNowBar()}

function tick(){
  const n=new Date();
  $("clock").textContent=fmtTime(pad(n.getHours())+":"+pad(n.getMinutes()));
  const h=n.getHours();
  $("greeting").textContent=(h<12?"Good morning":h<18?"Good afternoon":"Good evening")+", "+DAYS[n.getDay()];
}

/* ---------- form ---------- */
function renderEmojis(){
  $("emojis").innerHTML=EMOJIS.map(e=>`<button type="button" data-emoji="${e}" aria-pressed="${e===chosenEmoji}">${e}</button>`).join("");
}
function openForm(id=null,pin=false){
  editingId=id;
  const t=id?tasks.find(x=>x.id===id):null;
  $("formTitle").textContent=t?"Edit task":"New task";
  $("fTitle").value=t?.title||"";
  $("fDate").value=t?.date||selected;
  $("fTime").value=t?.time||"";
  $("fEnd").value=t?.end||"";
  $("fTag").value=t?.tag||"Personal";
  $("fNotes").value=t?.notes||"";
  $("fPin").checked=t?!!t.pinned:pin;
  $("fRemind").value=t?String(t.remind??0):"0";
  chosenEmoji=t?.emoji||EMOJIS[0];
  renderEmojis();
  $("delBtn").style.display=t?"":"none";
  $("dlg").showModal();
  $("fTitle").focus();
}

$("emojis").addEventListener("click",e=>{const b=e.target.closest("[data-emoji]");if(b){chosenEmoji=b.dataset.emoji;renderEmojis()}});
$("cancelBtn").onclick=()=>$("dlg").close();
$("delBtn").onclick=()=>{
  if(!editingId)return;
  const id=editingId;
  tasks=tasks.filter(t=>t.id!==id);
  $("dlg").close(); render(); remove(id);
};
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const title=$("fTitle").value.trim();
  if(!title){$("fTitle").focus();return}
  const existing=editingId?tasks.find(t=>t.id===editingId):null;
  const task={
    id:existing?.id||uid(), title, date:$("fDate").value||selected,
    time:$("fTime").value, end:$("fEnd").value, tag:$("fTag").value,
    notes:$("fNotes").value.trim(), emoji:chosenEmoji,
    pinned:$("fPin").checked, done:existing?.done||false,
    remind:Number($("fRemind").value||0)
  };
  tasks = existing ? tasks.map(t=>t.id===task.id?task:t) : [...tasks,task];
  selected=task.date;
  const d=parse(task.date); calMonth=new Date(d.getFullYear(),d.getMonth(),1);
  $("dlg").close(); render(); persist(task);
});

/* ---------- events ---------- */
$("timeline").addEventListener("click",e=>{
  const tog=e.target.closest("[data-toggle]");
  if(tog){const t=tasks.find(x=>x.id===tog.dataset.toggle);if(t){t.done=!t.done;render();persist({...t})}return}
  const ed=e.target.closest("[data-edit]");
  if(ed)openForm(ed.dataset.edit);
});
$("pins").addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]");
  if(j){const t=tasks.find(x=>x.id===j.dataset.jump);if(t){selected=t.date;const d=parse(t.date);calMonth=new Date(d.getFullYear(),d.getMonth(),1);render()}}
});
$("cal").addEventListener("click",e=>{const b=e.target.closest("[data-day]");if(b){selected=b.dataset.day;const d=parse(selected);calMonth=new Date(d.getFullYear(),d.getMonth(),1);render()}});
$("calPrev").onclick=()=>{calMonth.setMonth(calMonth.getMonth()-1);renderCal()};
$("calNext").onclick=()=>{calMonth.setMonth(calMonth.getMonth()+1);renderCal()};
function shiftDay(n){const d=parse(selected);d.setDate(d.getDate()+n);selected=iso(d);calMonth=new Date(d.getFullYear(),d.getMonth(),1);render()}
$("dayPrev").onclick=()=>shiftDay(-1);
$("dayNext").onclick=()=>shiftDay(1);
$("addBtn").onclick=()=>openForm();
function goToday(){selected=iso(new Date());const d=new Date();calMonth=new Date(d.getFullYear(),d.getMonth(),1);render()}
$("todayBtn").onclick=goToday;
$("railToday").onclick=goToday;
$("railAdd").onclick=()=>openForm();
$("railAlarm").onclick=()=>{$("alarmCard").scrollIntoView({behavior:"smooth",block:"center"});$("soundSel").focus({preventScroll:true})};
$("railTheme").onclick=()=>$("themeBtn").click();
$("nbPrev").onclick=()=>shiftDay(-1);
$("nbNext").onclick=()=>shiftDay(1);
$("nbDone").onclick=()=>{const t=nowTask&&tasks.find(x=>x.id===nowTask.id);if(t){t.done=true;render();persist({...t})}};
$("themeBtn").onclick=()=>{
  const root=document.documentElement;
  const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("daybook-theme",root.dataset.theme)}catch(e){}
};
try{const th=localStorage.getItem("daybook-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}

/* ---------- alarms ---------- */
const AL_ON="daybook-alarms-on", AL_FIRED="daybook-fired", AL_SNOOZE="daybook-snooze";
const readJSON=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const writeJSON=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let alarmsOn=readJSON(AL_ON,true);
let audioCtx=null, beepTimer=null, ringing=null, titleTimer=null;
const GRACE=10*60*1000; // still ring if the page opens up to 10 min late

function alarmKey(t){return t.id+"|"+t.date+"|"+t.time+"|"+t.remind}
function alarmAt(t){
  if(t.done||!t.time||t.remind<0)return null;
  const [h,m]=t.time.split(":").map(Number);
  const d=parse(t.date); d.setHours(h,m,0,0);
  return d.getTime()-t.remind*60000;
}
function unlockAudio(){
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}
}
const SOUND_KEY="daybook-sound", CUSTOM_KEY="daybook-custom-sound", CUSTOM_NAME="daybook-custom-name";
const SOUNDS={
  // bright, fast pulsing pings — the default
  pulse:{every:1100,play(){
    const pat=[1318.5,1760,1318.5,1760,2093];
    pat.forEach((f,i)=>tone(f,i*0.11,0.09,"triangle",0.3));
  }},
  // rising three-note wake-up
  sunrise:{every:1600,play(){
    [784,988,1175,1568].forEach((f,i)=>tone(f,i*0.16,0.28,"sine",0.28));
  }},
  // soft two-tone bell
  chime:{every:2200,play(){
    tone(1046.5,0,1.1,"sine",0.3); tone(784,0.45,1.3,"sine",0.26);
  }},
  // the original triple beep
  classic:{every:1500,play(){
    [0,0.18,0.36].forEach(off=>tone(880,off,0.15,"sine",0.35));
  }},
};
function tone(freq,start,len,type,vol){
  if(!audioCtx)return;
  const t0=audioCtx.currentTime+start;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+len);
  o.connect(g).connect(audioCtx.destination);
  o.start(t0); o.stop(t0+len+0.02);
}
let soundChoice=(()=>{try{return localStorage.getItem(SOUND_KEY)||"pulse"}catch(e){return "pulse"}})();
let customAudio=null;
function getCustom(){try{return localStorage.getItem(CUSTOM_KEY)}catch(e){return null}}
function startSound(){
  stopSound();
  if(soundChoice==="custom"&&getCustom()){
    customAudio=new Audio(getCustom()); customAudio.loop=true;
    customAudio.play().catch(()=>{});
    return;
  }
  const snd=SOUNDS[soundChoice]||SOUNDS.pulse;
  snd.play(); beepTimer=setInterval(()=>snd.play(),snd.every);
}
function stopSound(){
  clearInterval(beepTimer); beepTimer=null;
  if(customAudio){customAudio.pause();customAudio=null}
}
function beep(){ // short preview used when turning alarms on
  if(soundChoice==="custom"&&getCustom()){const a=new Audio(getCustom());a.play().catch(()=>{});setTimeout(()=>a.pause(),2500);return}
  (SOUNDS[soundChoice]||SOUNDS.pulse).play();
}
function renderAlarmWidget(){
  const perm=("Notification" in window)?Notification.permission:"unsupported";
  const upcoming=tasks.filter(t=>{const a=alarmAt(t);return a&&a>Date.now()}).length;
  if(!alarmsOn){
    $("alarmInfo").textContent="Alarms are off on this device.";
    $("alarmToggle").textContent="Turn on alarms"; $("alarmToggle").className="alarm-btn";
  }else{
    const soundReady=audioCtx&&audioCtx.state==="running";
    let info=!soundReady?"On. Click anywhere on the page once so the alarm can play sound.":upcoming?`${upcoming} upcoming reminder${upcoming>1?"s":""}. Keep this tab open to hear them.`:"On. Tasks with a start time will ring at that time.";
    if(perm==="denied")info+=" Pop-up notifications are blocked in your browser settings.";
    $("alarmInfo").textContent=info;
    $("alarmToggle").textContent="Turn off alarms"; $("alarmToggle").className="alarm-btn off";
  }
}
$("alarmToggle").onclick=async()=>{
  alarmsOn=!alarmsOn; writeJSON(AL_ON,alarmsOn);
  if(alarmsOn){
    unlockAudio(); beep();
    if("Notification" in window && Notification.permission==="default"){try{await Notification.requestPermission()}catch(e){}}
    checkAlarms();
  }
  renderAlarmWidget();
};
// browsers only allow sound after a click, so unlock on the first interaction
document.addEventListener("pointerdown",()=>{
  if(!alarmsOn)return;
  unlockAudio();
  if("Notification" in window && Notification.permission==="default"){try{Notification.requestPermission().then(renderAlarmWidget)}catch(e){}}
  renderAlarmWidget();
});

function ring(t){
  ringing=t;
  $("alarmEmoji").textContent=t.emoji||"⏰";
  $("alarmTitle").textContent=t.title;
  $("alarmWhen").textContent=(t.remind?`Starts in ${t.remind} min · `:"Starting now · ")+fmtTime(t.time);
  if(!$("alarmDlg").open){ if($("dlg").open)$("dlg").close(); $("alarmDlg").showModal(); }
  startSound();
  const orig="Daybook"; let flip=false; clearInterval(titleTimer);
  titleTimer=setInterval(()=>{document.title=(flip=!flip)?"⏰ "+t.title:orig},1000);
  if("Notification" in window && Notification.permission==="granted"){
    try{const n=new Notification("⏰ "+t.title,{body:$("alarmWhen").textContent,tag:alarmKey(t),requireInteraction:true});n.onclick=()=>{window.focus();n.close()}}catch(e){}
  }
  setTimeout(()=>{if(ringing===t)stopRinging()},60000); // stop sound after 1 minute
}
function stopRinging(){
  stopSound(); clearInterval(titleTimer); document.title="Daybook";
  ringing=null; if($("alarmDlg").open)$("alarmDlg").close();
}
function checkAlarms(){
  renderAlarmWidget();
  if(!alarmsOn||ringing)return;
  const now=Date.now(), fired=readJSON(AL_FIRED,{}), snooze=readJSON(AL_SNOOZE,{});
  // snoozed alarms first
  for(const [id,at] of Object.entries(snooze)){
    if(now>=at){
      delete snooze[id]; writeJSON(AL_SNOOZE,snooze);
      const t=tasks.find(x=>x.id===id&&!x.done); if(t){ring(t);return}
    }
  }
  for(const t of tasks){
    const at=alarmAt(t), key=alarmKey(t);
    if(at&&now>=at&&now-at<GRACE&&!fired[key]){
      fired[key]=now;
      // keep the list small
      for(const k in fired) if(now-fired[k]>7*864e5) delete fired[k];
      writeJSON(AL_FIRED,fired);
      ring(t); return;
    }
  }
}
function renderSoundUI(){
  $("soundSel").value=soundChoice;
  const row=$("customRow");
  if(soundChoice==="custom"){
    let name=null;try{name=localStorage.getItem(CUSTOM_NAME)}catch(e){}
    row.style.display="";
    row.innerHTML=(name?"Using: "+esc(name)+" · ":"No file chosen yet · ")+'<button type="button" class="link-btn" id="pickFile">'+(name?"Change file":"Choose file")+'</button>';
    $("pickFile").onclick=()=>$("soundFile").click();
  }else row.style.display="none";
}
$("soundSel").onchange=()=>{
  soundChoice=$("soundSel").value;
  try{localStorage.setItem(SOUND_KEY,soundChoice)}catch(e){}
  renderSoundUI();
  if(soundChoice==="custom"&&!getCustom())$("soundFile").click();
};
$("soundFile").onchange=()=>{
  const f=$("soundFile").files[0]; if(!f)return;
  if(f.size>2*1024*1024){setStatus("That sound file is over 2 MB. Choose a shorter clip.");return}
  const r=new FileReader();
  r.onload=()=>{
    try{localStorage.setItem(CUSTOM_KEY,r.result);localStorage.setItem(CUSTOM_NAME,f.name);setStatus("Alarm sound set to "+f.name+".")}
    catch(e){setStatus("Couldn't save that sound on this device. Try a smaller file.")}
    renderSoundUI();
  };
  r.readAsDataURL(f);
  $("soundFile").value="";
};
let previewing=false;
$("previewBtn").onclick=()=>{
  unlockAudio();
  if(previewing){stopSound();previewing=false;$("previewBtn").textContent="Play sound";return}
  previewing=true; $("previewBtn").textContent="Stop";
  startSound();
  setTimeout(()=>{if(previewing){stopSound();previewing=false;$("previewBtn").textContent="Play sound"}},5000);
};
renderSoundUI();

$("snoozeBtn").onclick=()=>{
  if(!ringing)return;
  const snooze=readJSON(AL_SNOOZE,{}); snooze[ringing.id]=Date.now()+5*60000; writeJSON(AL_SNOOZE,snooze);
  stopRinging();
};
$("dismissBtn").onclick=stopRinging;
$("alarmDoneBtn").onclick=()=>{
  const t=ringing&&tasks.find(x=>x.id===ringing.id);
  stopRinging();
  if(t){t.done=true;render();persist({...t})}
};
$("alarmDlg").addEventListener("cancel",e=>{e.preventDefault();stopRinging()});
setInterval(checkAlarms,5000);

/* ---------- start ---------- */
$("userEmail").textContent=session.user.email;
$("signOutBtn").onclick=async()=>{await sb.auth.signOut();location.replace("login.html")};
sb.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT")location.replace("login.html")});

tick(); setInterval(()=>{tick();renderNext();renderNowBar()},15000);
render();

const {data,error}=await sb.from("tasks").select("*").order("date");
if(error){setStatus("Couldn't load tasks: "+error.message)}
else{tasks=data.map(fromRow);setStatus("Synced with your account.");render();checkAlarms()}

// Live updates from your other devices (needs Realtime enabled on the table)
sb.channel("tasks-live")
  .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},p=>{
    if(p.eventType==="DELETE"){tasks=tasks.filter(t=>t.id!==p.old.id)}
    else{const t=fromRow(p.new);const i=tasks.findIndex(x=>x.id===t.id);if(i>=0)tasks[i]=t;else tasks.push(t)}
    render();
  }).subscribe();
})();
</script>
</body>
</html>
